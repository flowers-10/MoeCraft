name: moecraft-staging

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - staging-database:/var/lib/mysql
    networks:
      - moecraft-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable tag or digest}
    restart: unless-stopped
    env_file:
      - staging.env
    networks:
      - moecraft-internal
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  storefront:
    image: ${STOREFRONT_IMAGE:?set STOREFRONT_IMAGE to an immutable tag or digest}
    restart: unless-stopped
    env_file:
      - staging.env
    networks:
      - moecraft-internal
    depends_on:
      api:
        condition: service_healthy

  admin:
    image: ${ADMIN_IMAGE:?set ADMIN_IMAGE to an immutable tag or digest}
    restart: unless-stopped
    env_file:
      - staging.env
    networks:
      - moecraft-internal
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - moecraft-internal
    depends_on:
      - storefront
      - api
      - admin

networks:
  moecraft-internal:
    driver: bridge

volumes:
  staging-database:
