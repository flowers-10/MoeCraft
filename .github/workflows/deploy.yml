name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/moecraft-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/moecraft-storefront:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/moecraft-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          command_timeout: 25m          script: |
            set -euo pipefail

            IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            OWNER="${{ github.repository_owner }}"
            API_IMAGE="ghcr.io/${OWNER}/moecraft-api:${IMAGE_TAG}"
            STOREFRONT_IMAGE="ghcr.io/${OWNER}/moecraft-storefront:${IMAGE_TAG}"
            ADMIN_IMAGE="ghcr.io/${OWNER}/moecraft-admin:${IMAGE_TAG}"
            GHCR_TOKEN="${{ secrets.GHCR_READ_TOKEN }}"
            STAGING_ENV="${{ secrets.STAGING_ENV_B64 }}"

            echo "=== GHCR login ==="
            if [ -z "${GHCR_TOKEN}" ]; then echo "FATAL: GHCR_READ_TOKEN secret is empty"; exit 1; fi
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${OWNER}" --password-stdin 2>&1 | tail -1

            echo "=== Pulling images (parallel) ==="
            docker pull --quiet "${API_IMAGE}" &
            PID_API=$!
            docker pull --quiet "${STOREFRONT_IMAGE}" &
            PID_SF=$!
            docker pull --quiet "${ADMIN_IMAGE}" &
            PID_AD=$!
            wait $PID_API || { echo "FATAL: pull API failed"; exit 1; }
            wait $PID_SF  || { echo "FATAL: pull storefront failed"; exit 1; }
            wait $PID_AD  || { echo "FATAL: pull admin failed"; exit 1; }
            echo "All images pulled"

            echo "=== Setup deploy dir ==="
            mkdir -p /opt/moecraft/deploy
            cd /opt/moecraft/deploy

            echo "=== staging.env ==="
            if [ -z "${STAGING_ENV}" ]; then echo "FATAL: STAGING_ENV_B64 secret is empty"; exit 1; fi
            echo "${STAGING_ENV}" | base64 -d > staging.env
            chmod 600 staging.env

            echo "=== gateway.conf ==="
            cat > gateway.conf << 'GWEOF'
            upstream storefront { server moecraft-staging-storefront-1:3100; }
            upstream api { server moecraft-staging-api-1:3102; }
            upstream admin { server moecraft-staging-admin-1:80; }

            server {
                listen 80;
                server_name _;
                location /api/ {
                    proxy_pass http://api/api/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
                location / {
                    proxy_pass http://storefront/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }

            server {
                listen 8081;
                server_name _;
                location / {
                    proxy_pass http://admin/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            GWEOF
            echo "gateway.conf written"

            echo "=== docker-compose.yml ==="
            cat > docker-compose.yml << 'DCEOF'
            name: moecraft-staging

            services:
              database:
                image: mysql:8.4
                restart: unless-stopped
                environment:
                  MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
                  MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
                  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
                volumes:
                  - staging-database:/var/lib/mysql
                networks:
                  - moecraft-internal
                healthcheck:
                  test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
                  interval: 5s
                  timeout: 5s
                  retries: 20

              api:
                image: ${API_IMAGE:?set API_IMAGE}
                restart: unless-stopped
                env_file:
                  - staging.env
                networks:
                  - moecraft-internal
                depends_on:
                  database:
                    condition: service_healthy
                read_only: true
                tmpfs:
                  - /tmp:size=64m,mode=1777
                security_opt:
                  - no-new-privileges:true
                stop_grace_period: 30s
                healthcheck:
                  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
                  interval: 15s
                  timeout: 3s
                  start_period: 20s
                  retries: 3

              storefront:
                image: ${STOREFRONT_IMAGE:?set STOREFRONT_IMAGE}
                restart: unless-stopped
                env_file:
                  - staging.env
                networks:
                  - moecraft-internal
                depends_on:
                  api:
                    condition: service_healthy

              admin:
                image: ${ADMIN_IMAGE:?set ADMIN_IMAGE}
                restart: unless-stopped
                env_file:
                  - staging.env
                networks:
                  - moecraft-internal
                depends_on:
                  api:
                    condition: service_healthy

              gateway:
                image: nginx:alpine
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "8081:8081"
                volumes:
                  - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
                networks:
                  - moecraft-internal
                depends_on:
                  - storefront
                  - api
                  - admin

            networks:
              moecraft-internal:
                driver: bridge

            volumes:
              staging-database:
            DCEOF
            echo "docker-compose.yml written"

            echo "=== Starting services ==="
            API_IMAGE="${API_IMAGE}" STOREFRONT_IMAGE="${STOREFRONT_IMAGE}" ADMIN_IMAGE="${ADMIN_IMAGE}" docker compose up -d --remove-orphans 2>&1 | tail -20

            echo "=== DB migration ==="
            sleep 15
            docker compose exec -T api sh -c 'npx prisma migrate deploy --schema prisma/schema.prisma' 2>&1 || echo "INFO: migration skipped (may already be up to date, or DB not ready yet)"

            echo "=== Health check ==="
            for i in 1 2 3 4 5 6; do
              if curl -sf -o /dev/null http://127.0.0.1/api/v1/health 2>/dev/null; then
                echo "API health OK (attempt $i)"
                break
              fi
              echo "Waiting for API... ($i/6)"
              sleep 10
            done

            echo "=== Container status ==="
            docker compose ps

            echo "Deploy complete: tag=${IMAGE_TAG}"
